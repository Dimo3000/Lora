name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Download offline speech model
        run: bash scripts/download-vosk-model.sh
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk Lora.apk
      - uses: actions/upload-artifact@v4
        with:
          name: lora-assistant-apk
          path: Lora.apk
      # Каждая версия (versionName в app/build.gradle.kts) получает свой релиз v1.2, v1.3 и т.д.
      # Повторные сборки той же версии обновляют APK в её релизе.
      # Ссылка .../releases/latest/download/Lora.apk всегда ведёт на самую новую версию.
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          NOTES="Версия $VERSION (сборка из коммита ${GITHUB_SHA::7}). Скачайте Lora.apk и установите на телефон поверх старой версии."
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" Lora.apk --clobber
            gh release edit "v$VERSION" --notes "$NOTES"
          else
            gh release create "v$VERSION" Lora.apk --title "Лора $VERSION" --notes "$NOTES" --target "$GITHUB_SHA" --latest
          fi
          # Старый общий релиз «latest» больше не нужен.
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
